[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "price-agent-windows-desktop"
version = "0.1.0"
description = "Local Windows QQ desktop automation service"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "numpy>=1.24,<3",
  "opencv-python>=4.8,<6",
  "Pillow>=10,<12",
  "pyautogui>=0.9.54,<1",
  "pyperclip>=1.8,<2",
  "pywin32>=306,<307 ; sys_platform == 'win32'",
  "pywinauto>=0.6.8,<1",
  "rapidocr-onnxruntime>=1.4.4,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[project.scripts]
price-agent-qq-service = "service.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
