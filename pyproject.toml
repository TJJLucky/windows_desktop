# 仅用于开发依赖、测试配置与 exe 构建元数据；发行形态不包含 wheel 或 console script。
[project]
name = "price-agent-windows-desktop"
version = "0.1.0"
description = "Local Windows QQ desktop automation service"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "numpy>=1.24,<3",
  "opencv-python>=4.8,<6",
  "Pillow>=10,<12",
  "pyautogui>=0.9.54,<1",
  "psutil>=5.9,<8",
  "pyperclip>=1.8,<2",
  "pywin32>=306,<307 ; sys_platform == 'win32'",
  "pywinauto>=0.6.8,<1",
  "rapidocr-onnxruntime>=1.4.4,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["service", "utils"]

[tool.hatch.build.targets.wheel.force-include]
"libs/input_event.dll" = "libs/input_event.dll"
"libs/wgc_capture.dll" = "libs/wgc_capture.dll"
"templates" = "templates"

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
